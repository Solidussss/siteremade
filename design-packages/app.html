<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteRemade · Websites built on hand-made designs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/styles.css">
<style>
/* the premium designs studio, in SiteRemade's own look (styles.css: tokens, nav, buttons, glows, browser frame) */
.studio{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:72px 0 120px}
.studio-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:56px;align-items:end;margin-bottom:64px}
.studio-hero h1{margin:0;font-size:clamp(54px,6.6vw,104px);line-height:.9;letter-spacing:-.07em}
.studio-hero h1 span{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;letter-spacing:-.05em}
.studio-hero p.lede{margin:0;color:var(--muted);font-size:17px;line-height:1.65;max-width:460px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px;padding:0;list-style:none}
.steps li{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.6)}
.steps li.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.steps li.done{color:var(--text)}
/* how it works */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:-24px 0 18px;padding:0;list-style:none}
.how li{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px}
.how b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;font-size:13px}
.how h3{margin:14px 0 6px;font-size:18px;letter-spacing:-.02em}
.how p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
.price{margin:0 0 40px;color:var(--muted);font-size:15px}.price strong{color:var(--dark)}
@media(max-width:720px){.how{grid-template-columns:1fr;margin-top:-8px}}
/* photos in the request */
.gphotos{display:grid;gap:8px}.gphotos .gl{font-size:14px;font-weight:600}.gphotos small{color:var(--muted);font-weight:400}
.gthumbs{display:flex;flex-wrap:wrap;gap:8px}.gthumbs:empty{display:none}.gth{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden}
.gth img{width:100%;height:100%;object-fit:cover}.gth button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.gadd{justify-self:start}
/* the owner's free start */
.exstart{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.exstart input{flex:1;min-width:180px;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
/* editor photo fields */
.eph .ephimg{border:1px dashed var(--line);border-radius:12px;min-height:90px;display:grid;place-items:center;overflow:hidden;background:#fafafa}
.eph .ephimg img{display:block;width:100%;max-height:220px;object-fit:cover}.eph .ephimg span{color:var(--muted);font-size:13px;padding:14px;text-align:center}
/* get this design */
.dacts{display:flex;gap:8px;flex:none}
.getbox{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px}
.getcard{position:relative;background:#fff;border-radius:var(--radius);padding:28px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:12px;grid-template-columns:1fr}
.getcard h2{margin:0;font-size:28px;letter-spacing:-.04em}.getcard .sub{margin:0 0 6px;color:var(--muted);line-height:1.55}
.getcard .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
.getcard .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media(max-width:720px){.dmeta{flex-direction:column;align-items:flex-start}}
/* design cards */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;display:grid;gap:18px}
.dcard:hover{transform:translateY(-4px);box-shadow:0 30px 80px rgba(0,0,0,.10)}
.dcard[aria-pressed="true"]{border-color:var(--dark);box-shadow:0 0 0 2px var(--dark),0 30px 80px rgba(0,0,0,.12)}
.frame{background:#111318;padding:8px;border-radius:20px;position:relative;overflow:hidden}
.frame .browser-top{height:30px;padding:0 6px}
.frame .browser-address{font-size:9px;padding:5px 14px}
.screen{position:relative;overflow:hidden;border-radius:12px;background:#000 center/cover no-repeat;aspect-ratio:16/10}
.screen iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.screen.live iframe{pointer-events:auto}
.dmeta{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:0 8px 8px}
.dmeta h3{margin:0;font-size:30px;letter-spacing:-.05em}
.dmeta p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tag{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
/* panels */
.panel{background:#fff;border-radius:24px;padding:32px;box-shadow:0 16px 60px rgba(0,0,0,.06);margin-top:36px}
.panel h2{margin:0 0 6px;font-size:clamp(32px,3.4vw,48px);letter-spacing:-.06em;line-height:1}
.panel h2 span{font-family:Georgia,serif;font-style:italic;font-weight:400}

.bform{display:grid;grid-template-columns:1fr 1fr;gap:17px}

.err{color:#b42318;font-size:14px;margin:0}

.writing{background:var(--dark);color:#fff;border-radius:var(--radius);padding:42px;margin-top:36px;display:grid;gap:22px}
.writing h2{margin:0;font-size:clamp(34px,3.6vw,52px);letter-spacing:-.06em;line-height:1}
.writing h2 span{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#c9ccff}
.wsteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wsteps li{display:flex;gap:12px;align-items:center;color:#858995;font-size:15px}
.wsteps li i{width:10px;height:10px;border-radius:50%;background:#3a3d46;flex:none}
.wsteps li.on{color:#fff}.wsteps li.on i{background:var(--accent);box-shadow:0 0 0 6px rgba(49,92,255,.25);animation:pulse 1.4s ease-in-out infinite}
.wsteps li.done{color:#c6c9d2}.wsteps li.done i{background:#3ecf8e}

.wlog{border-top:1px solid rgba(255,255,255,.13);padding-top:16px;font-size:13px;color:#a3a7b2;display:grid;gap:6px}
.wlog b{color:#fff}.wlog .bad{color:#ffb86b}

.review{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;margin-top:36px;align-items:start}
.devices{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:end}.devices.one{grid-template-columns:1fr;justify-items:center}
.phone{background:#111318;border-radius:34px;padding:9px;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.phone .pscreen{position:relative;overflow:hidden;border-radius:26px;aspect-ratio:390/844;background:#000}
.phone iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0}
.side{display:grid;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{margin:0 0 4px;font-size:20px;letter-spacing:-.03em}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.st{font-size:11px;font-weight:750;letter-spacing:.02em}.st.pr{color:#b4561f}.st.il{color:#5b6b8c}
.rk{font-size:12px;color:var(--muted);margin:-4px 0 12px}.rk b{color:var(--ink,#111)}
.blk{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#d9dbe1}.blk li{padding:6px 0;border-top:1px solid rgba(255,255,255,.12)}
.editor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;align-items:start}
.epreview{position:sticky;top:18px}.eptabs{display:flex;gap:8px;margin-bottom:10px}.eptabs [aria-pressed="true"]{background:var(--dark);color:#fff}
.epframe{height:78vh;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 16px 60px rgba(0,0,0,.08);margin:0 auto;transition:width .3s}.epframe iframe{width:100%;height:100%;border:0}.epframe.phone{width:390px;max-width:100%}
.epanel{background:#fff;border-radius:24px;padding:24px;box-shadow:0 16px 60px rgba(0,0,0,.06)}
.epanel h3{margin:0 0 6px;font-size:24px;letter-spacing:-.04em}.ebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.epanel details{border-top:1px solid var(--line);padding:10px 0}.epanel summary{cursor:pointer;font-weight:750}.epanel summary span{color:var(--muted);font-weight:400}
.efields{display:grid;gap:12px;margin-top:12px}.ef{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}.ef small{font-weight:400;color:var(--muted)}
.ef input,.ef textarea,.ef select{width:100%;border:1px solid var(--line);background:#fafafa;padding:10px;border-radius:10px;font-size:14px;font-weight:400}.ef textarea{min-height:72px}.ef input[type=color]{height:42px;padding:4px}
.wk{display:grid;gap:6px}.wk>div{display:grid;grid-template-columns:44px 74px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-weight:500}.wk input[type=time]{padding:6px;min-width:0;width:100%}.wk label{display:flex;gap:5px;align-items:center}
.oc{display:flex;gap:10px;align-items:center}.oc label{display:flex;gap:6px;align-items:center;font-weight:500;white-space:nowrap}.oc input[type=color]{flex:1}
.ferr{color:#b4361f;font-style:normal;font-weight:500}.ferr:empty{display:none}.elist{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px}
@media(max-width:900px){.editor{grid-template-columns:minmax(0,1fr)}.epanel{padding:18px}.epreview{position:static}.epframe{height:70vh}}
.ask{margin:6px 0 40px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.askbar{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 24px;background:#fff;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 50px rgba(17,19,24,.10);border:1px solid rgba(17,19,24,.06)}
.askbar textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:500 18px/1.4 inherit;padding:14px 0;min-height:52px;color:var(--dark)}
.askbar textarea::placeholder{color:#9aa0aa}.askbar .button{white-space:nowrap;padding:16px 26px;gap:8px}
.askbar:focus-within{box-shadow:0 0 0 3px rgba(17,19,24,.10),0 18px 50px rgba(17,19,24,.12)}
.askhint{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0 24px;color:var(--muted);font-size:14px}
.ex{border:1px solid rgba(17,19,24,.10);background:rgba(255,255,255,.6);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;color:#3a3e46;cursor:pointer}.ex:hover{background:#fff;border-color:rgba(17,19,24,.2)}
@media(max-width:640px){.askbar{border-radius:22px;flex-direction:column;align-items:stretch;padding:14px}.askbar .button{justify-content:center}.askhint{margin-left:4px}}.route{margin-top:18px;padding:22px 26px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(17,19,24,.08);display:grid;grid-template-columns:1fr auto;column-gap:24px;align-items:center}.route>*{grid-column:1}.route .actions{grid-column:2;grid-row:1/4;margin:0}@media(max-width:640px){.route{grid-template-columns:1fr}.route .actions{grid-column:1;grid-row:auto;margin-top:6px}}.route h3{margin:6px 0;font-size:24px;letter-spacing:-.04em}.route p{margin:0 0 12px;color:var(--muted)}
.older{margin:34px 0 10px;font-size:18px;letter-spacing:-.03em}.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}.plist a{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:14px 18px;border-radius:14px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 6px 24px rgba(0,0,0,.05)}.plist span{color:var(--muted);font-size:13px}.plist em{font-style:normal;font-weight:750}
.reqs .rq{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.reqs .rq:first-of-type{border-top:0}
.reqs .rq.done{opacity:.55}
.reqs .rq b{font-size:15px;letter-spacing:-.01em}
.reqs .rq .rk{font-size:12px;color:var(--muted);letter-spacing:.02em}
.reqs .rq .who{font-size:14px}.reqs .rq .who a{color:inherit}
.reqs .rq details{font-size:13px;color:var(--muted)}.reqs .rq details summary{cursor:pointer}
.reqs .rq table{border-collapse:collapse;margin-top:6px}.reqs .rq td{padding:2px 10px 2px 0;vertical-align:top}
.reqs .rq .mark{justify-self:start;font-weight:600;font-size:12px;line-height:1;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;color:inherit}
.pill.req{background:#111;color:#fff}
.publish{background:var(--dark);color:#fff;border-color:var(--dark)}
.publish h3{color:#fff}.publish p{color:#a3a7b2}
.publish .button{width:100%;background:#fff;color:#111;margin-top:16px}
.publish .button.off{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
.livelink{margin-top:14px;display:flex;gap:8px;align-items:center;background:#1c1f26;border-radius:12px;padding:10px 12px;font-size:12px;color:#c6c9d2;word-break:break-all}
.livelink a{color:#fff;font-weight:650}
.facts details{border-top:1px solid var(--line);padding:12px 0}
.facts details:last-child{border-bottom:1px solid var(--line)}
.facts summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;justify-content:space-between;list-style:none}
.facts summary::-webkit-details-marker{display:none}
.facts summary span{color:var(--muted);font-weight:600}
.facts ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{font-size:13px;color:var(--muted);line-height:1.45}
.facts li b{color:var(--text);font-weight:650}
.readback{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}
.readback table{width:100%;border-collapse:collapse;font-size:13px}
.readback td,.readback th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}
.readback th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.q{background:#f6f7fb;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font-size:15px;line-height:1.5}
.ok{color:#17733a}
/* your sites */
.sites{margin-top:90px;padding-top:60px;border-top:1px solid var(--line)}
.sites h2{margin:0 0 28px;font-size:clamp(34px,3.6vw,52px);letter-spacing:-.06em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.scard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:12px;transition:transform .2s ease,box-shadow .2s ease}
.scard:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,.08)}
.scard .screen{border-radius:12px}
.scard .smeta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 6px 6px}
.scard b{font-size:15px;letter-spacing:-.02em}
.pill{font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;border-radius:999px;padding:6px 10px;background:#eef0f4;color:var(--muted);white-space:nowrap}
.pill.live{background:#e3f6ea;color:#17733a}.pill.need{background:#fff1df;color:#9a5b00}.pill.fail{background:#fde8e6;color:#b42318}
.empty{color:var(--muted)}
.blank{display:grid;place-items:center;color:#5b5f6a;font-size:12px;letter-spacing:.14em;text-transform:uppercase;height:100%;position:absolute;inset:0}
.signin{max-width:440px}
@media(max-width:980px){.studio-hero{grid-template-columns:1fr;gap:24px}.review{grid-template-columns:1fr}}
@media(max-width:720px){.studio{width:min(100% - 30px,var(--max));padding-top:48px}.gallery{grid-template-columns:1fr}.bform{grid-template-columns:1fr}.panel,.writing{padding:24px}.devices{grid-template-columns:1fr}.devices .phone{width:100%;max-width:240px;margin:0 auto}.dmeta h3{font-size:26px}}
/* pick a design: the working original beside one prompt box (2026-10-22) */
.pick{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start}
.pick-preview .frame,.pick-preview iframe{border-radius:14px}
.pick-ask textarea#about{width:100%;min-height:120px;font:inherit;font-size:17px;line-height:1.5;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fafafa;color:inherit;resize:vertical;outline:none}
.pick-ask .more{margin:16px 0 18px}.pick-ask .more summary{cursor:pointer;font-weight:600}
.pick-ask .more .bform{grid-template-columns:1fr;margin-top:12px}
@media (max-width:900px){.pick{grid-template-columns:1fr}}
/* ask for a change (2026-10-22) */
.eask{background:#f6f5f2;border-radius:16px;padding:14px;margin:14px 0}.eask label{display:block;font-size:14px;margin-bottom:8px}.eask small{color:var(--muted);font-weight:400}
.eask textarea{width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px;font:inherit;font-size:15px;resize:vertical;outline:none}
.aplan{margin-top:12px;font-size:14px}.aplan p{margin:0 0 8px}.adiff{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px}
.adiff li{display:grid;gap:3px;background:#fff;border-radius:10px;padding:8px 10px;font-size:13px}.adiff li span{color:var(--muted);overflow-wrap:anywhere}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.acant{background:#fff7ec;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}.acant ul{margin:6px 0 0;padding-left:18px}
</style></head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// a phone or tablet: every live preview is a whole design with big canvases, and iOS Safari closes a page that holds too
// many, so a touch screen runs one at a time

      ${listCtl ? `<details><summary>Lists <span>${ed.lists.length}</span></summary>${listCtl}</details>` : ''}
    </aside></section>`;
  $('#back').onclick = load;
  const save = $('#esave');
  $('#app').querySelectorAll('[data-p]').forEach((el) => el.addEventListener('input', () => { pending.set(el.dataset.p, el.value); save.disabled = false; }));
  $('#app').querySelectorAll('[data-week]').forEach((wk) => wk.addEventListener('input', () => {
    const v = {}; wk.querySelectorAll('[data-day]').forEach((row) => { const on = row.querySelector('[data-open]').checked; row.querySelectorAll('[data-t]').forEach((t) => { t.disabled = !on; }); v[row.dataset.day] = on ? { open: row.querySelector('[data-t="open"]').value, close: row.querySelector('[data-t="close"]').value } : null; });
    pending.set(wk.dataset.week, JSON.stringify(v)); save.disabled = false;
  }));
  // photos: the longest side to 1600 px as a JPEG, smaller until it fits the design's limit
  const shrink = shrinkPhoto;
  $('#app').querySelectorAll('[data-photo]').forEach((box) => {
    const path = box.dataset.photo, pic = box.querySelector('.ephimg');
    box.querySelector('input[type=file]').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      pic.innerHTML = '<span>Preparing the photo…</span>';
      try { const url = await shrink(file); pic.innerHTML = `<img src="${url}" alt="">`; pending.set(path, url); save.disabled = false; }
      catch (err) { pic.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    });
    const rm = box.querySelector('[data-phrm]'); if (rm) rm.onclick = () => { pic.innerHTML = '<span>Removed: the design’s drawing shows after you save</span>'; pending.set(path, ''); save.disabled = false; };
  });
  $('#app').querySelectorAll('[data-oc]').forEach((cb) => cb.addEventListener('change', () => { const c = $(`[data-p="${CSS.escape(cb.dataset.oc)}"]`); c.disabled = !cb.checked; pending.set(cb.dataset.oc, cb.checked ? c.value : ''); save.disabled = false; }));
  $('#app').querySelectorAll('[data-add],[data-rm]').forEach((b) => b.addEventListener('click', () => { ops.push(b.dataset.add ? { op: 'add', list: b.dataset.add } : { op: 'remove', list: b.dataset.rm }); b.disabled = true; save.disabled = false; }));
  $('#app').querySelectorAll('[data-dev]').forEach((b) => b.addEventListener('click', () => { $('#epframe').classList.toggle('phone', b.dataset.dev === 'phone'); $('#app').querySelectorAll('[data-dev]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  save.onclick = async () => {
    save.disabled = true; $('#eerr').textContent = ''; $('#app').querySelectorAll('.ferr').forEach((e) => { e.textContent = ''; });
    const r2 = await api(`/api/designs/sites/${s.id}/edit`, { changes: [...pending].map(([path, value]) => ({ path, value })), ops });
    if (r2.ok) return showEditor(r2.site);
    $('#eerr').textContent = r2.message || 'Something went wrong.';
    for (const e of r2.errors || []) { const p = String(e).split(':')[0]; const slot = $(`.ferr[data-e="${CSS.escape(p)}"]`); if (slot) slot.textContent = e.slice(p.length + 1).trim(); else $('#eerr').textContent += ' ' + e; }
    save.disabled = false;
  };
  $('#eundo').onclick = async () => { const r2 = await api(`/api/designs/sites/${s.id}/undo`, {}); if (r2.ok) showEditor(r2.site); };
  // Ask for a change (lib/design-ask.js): request -> plan (nothing saved) -> Apply saves it like any edit, with undo
  const KIND = { content: 'Words', design: 'Look', animation: 'Animation', mixed: 'Words and look', none: 'Nothing to change' };
  const show1 = (v) => (v && typeof v === 'object' ? JSON.stringify(v) : String(v == null ? '—' : v)).replace(/\*/g, '');
  const cell = (v) => /^#[0-9a-f]{6}$/i.test(String(v)) ? `<i class="sw" style="background:${esc(v)}"></i>${esc(v)}` : esc(show1(v).slice(0, 160));
  $('#askq').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#askgo').click(); } });
  $('#askgo').onclick = async () => {
    const q = $('#askq').value.trim(); if (!q) { $('#askq').focus(); return; }
    const go = $('#askgo'); go.disabled = true; $('#askplan').innerHTML = '<p class="note">Working out the change…</p>';
    const r2 = await api(`/api/designs/sites/${s.id}/ask`, { request: q }); go.disabled = false;
    if (r2.sent) { $('#askq').value = ''; $('#askplan').innerHTML = `<p class="note">${esc(r2.message)}</p>`; return; }
    if (!r2.ok || !r2.plan) { $('#askplan').innerHTML = `<p class="err">${esc(r2.message || 'Something went wrong.')}</p>`; return; }
    const pl = r2.plan, can = pl.diff.length > 0;
    $('#askplan').innerHTML = `<div class="aplan"><p><span class="pill">${esc(KIND[pl.kind] || 'Change')}</span> ${esc(pl.summary || '')}</p>
      ${pl.question ? `<p class="q">${esc(pl.question)}</p>` : ''}
      ${can ? `<ul class="adiff">${pl.diff.map((x) => `<li><b>${esc(ED_LABEL(x.path))}</b>${x.approved ? ' <span class="st pr">You confirmed this earlier</span>' : ''}<span>${cell(x.before)} → ${cell(x.after)}</span></li>`).join('')}</ul>` : ''}
      ${pl.cannot.length ? `<div class="acant"><b>What this design can’t do</b><ul>${pl.cannot.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      <div class="ebar">${can ? '<button class="button" id="askapply">Apply this change</button>' : ''}<button class="button button-secondary" id="askdrop">${can ? 'Discard' : 'OK'}</button></div><p class="err" id="askerr"></p></div>`;
    $('#askdrop').onclick = () => { $('#askplan').innerHTML = ''; };
    if (can) $('#askapply').onclick = async () => {
      $('#askapply').disabled = true;
      const r3 = await api(`/api/designs/sites/${s.id}/edit`, { changes: pl.changes, ops: pl.ops, rename: pl.rename, via: 'ask' });
      if (r3.ok) return showEditor(r3.site);
      $('#askerr').textContent = (r3.message || 'Something went wrong.') + ' ' + (r3.errors || []).join(' ');
      $('#askapply').disabled = false;
    };
  };
  $('#edone').onclick = () => show(s);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
load();
</script>
</body></html>
