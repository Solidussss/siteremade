<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Designs · SiteRemade</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/styles.css">
<style>
/* the premium designs studio, in SiteRemade's own look (styles.css: tokens, nav, buttons, glows, browser frame) */
.studio{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:72px 0 120px}
.studio-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:56px;align-items:end;margin-bottom:64px}
.studio-hero h1{margin:0;font-size:clamp(54px,6.6vw,104px);line-height:.9;letter-spacing:-.07em}
.studio-hero h1 span{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;letter-spacing:-.05em}
.studio-hero p.lede{margin:0;color:var(--muted);font-size:17px;line-height:1.65;max-width:460px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px;padding:0;list-style:none}
.steps li{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.6)}
.steps li.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.steps li.done{color:var(--text)}
/* design cards */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;display:grid;gap:18px}
.dcard:hover{transform:translateY(-4px);box-shadow:0 30px 80px rgba(0,0,0,.10)}
.dcard[aria-pressed="true"]{border-color:var(--dark);box-shadow:0 0 0 2px var(--dark),0 30px 80px rgba(0,0,0,.12)}
.frame{background:#111318;padding:8px;border-radius:20px;position:relative;overflow:hidden}
.frame .browser-top{height:30px;padding:0 6px}
.frame .browser-address{font-size:9px;padding:5px 14px}
.screen{position:relative;overflow:hidden;border-radius:12px;background:#000;aspect-ratio:16/10}
.screen iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.screen.live iframe{pointer-events:auto}
.dmeta{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:0 8px 8px}
.dmeta h3{margin:0;font-size:30px;letter-spacing:-.05em}
.dmeta p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tag{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
/* panels */
.panel{background:#fff;border-radius:24px;padding:32px;box-shadow:0 16px 60px rgba(0,0,0,.06);margin-top:36px}
.panel h2{margin:0 0 6px;font-size:clamp(32px,3.4vw,48px);letter-spacing:-.06em;line-height:1}
.panel h2 span{font-family:Georgia,serif;font-style:italic;font-weight:400}
.panel .sub{color:var(--muted);margin:0 0 26px;font-size:15px;line-height:1.6}
.bform{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.bform label{display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:750;letter-spacing:.02em}
.bform label small{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.bform input,.bform textarea,.bform select{width:100%;border:1px solid var(--line);background:#fafafa;min-height:50px;padding:13px;outline:none;border-radius:10px;font-size:15px}
.bform textarea{min-height:96px;resize:vertical}
.bform input:focus,.bform textarea:focus{border-color:#8e94a0;background:#fff}
.bform .wide{grid-column:1/-1}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:13px}
.err{color:#b42318;font-size:14px;margin:0}
/* writing */
.writing{background:var(--dark);color:#fff;border-radius:var(--radius);padding:42px;margin-top:36px;display:grid;gap:22px}
.writing h2{margin:0;font-size:clamp(34px,3.6vw,52px);letter-spacing:-.06em;line-height:1}
.writing h2 span{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#c9ccff}
.wsteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wsteps li{display:flex;gap:12px;align-items:center;color:#858995;font-size:15px}
.wsteps li i{width:10px;height:10px;border-radius:50%;background:#3a3d46;flex:none}
.wsteps li.on{color:#fff}.wsteps li.on i{background:var(--accent);box-shadow:0 0 0 6px rgba(49,92,255,.25);animation:pulse 1.4s ease-in-out infinite}
.wsteps li.done{color:#c6c9d2}.wsteps li.done i{background:#3ecf8e}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(49,92,255,.08)}}
.wlog{border-top:1px solid rgba(255,255,255,.13);padding-top:16px;font-size:13px;color:#a3a7b2;display:grid;gap:6px}
.wlog b{color:#fff}.wlog .bad{color:#ffb86b}
/* review */
.review{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;margin-top:36px;align-items:start}
.devices{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:end}
.phone{background:#111318;border-radius:34px;padding:9px;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.phone .pscreen{position:relative;overflow:hidden;border-radius:26px;aspect-ratio:390/844;background:#000}
.phone iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0}
.side{display:grid;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{margin:0 0 4px;font-size:20px;letter-spacing:-.03em}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.st{font-size:11px;font-weight:750;letter-spacing:.02em}.st.pr{color:#b4561f}.st.il{color:#5b6b8c}
.rk{font-size:12px;color:var(--muted);margin:-4px 0 12px}.rk b{color:var(--ink,#111)}
.blk{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#d9dbe1}.blk li{padding:6px 0;border-top:1px solid rgba(255,255,255,.12)}
.editor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;align-items:start}
.epreview{position:sticky;top:18px}.eptabs{display:flex;gap:8px;margin-bottom:10px}.eptabs [aria-pressed="true"]{background:var(--dark);color:#fff}
.epframe{height:78vh;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 16px 60px rgba(0,0,0,.08);margin:0 auto;transition:width .3s}.epframe iframe{width:100%;height:100%;border:0}.epframe.phone{width:390px;max-width:100%}
.epanel{background:#fff;border-radius:24px;padding:24px;box-shadow:0 16px 60px rgba(0,0,0,.06)}
.epanel h3{margin:0 0 6px;font-size:24px;letter-spacing:-.04em}.ebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.epanel details{border-top:1px solid var(--line);padding:10px 0}.epanel summary{cursor:pointer;font-weight:750}.epanel summary span{color:var(--muted);font-weight:400}
.efields{display:grid;gap:12px;margin-top:12px}.ef{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}.ef small{font-weight:400;color:var(--muted)}
.ef input,.ef textarea,.ef select{width:100%;border:1px solid var(--line);background:#fafafa;padding:10px;border-radius:10px;font-size:14px;font-weight:400}.ef textarea{min-height:72px}.ef input[type=color]{height:42px;padding:4px}
.wk{display:grid;gap:6px}.wk>div{display:grid;grid-template-columns:44px 74px 1fr 1fr;gap:8px;align-items:center;font-weight:500}.wk input[type=time]{padding:6px}.wk label{display:flex;gap:5px;align-items:center}
.oc{display:flex;gap:10px;align-items:center}.oc label{display:flex;gap:6px;align-items:center;font-weight:500;white-space:nowrap}.oc input[type=color]{flex:1}
.ferr{color:#b4361f;font-style:normal;font-weight:500}.ferr:empty{display:none}.elist{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px}
@media(max-width:900px){.editor{grid-template-columns:1fr}.epreview{position:static}.epframe{height:70vh}}
.create{margin-top:0}.create textarea{min-height:84px}.route{margin-top:18px;padding:22px;border-radius:18px;background:#f4f5f7}.route h3{margin:6px 0;font-size:24px;letter-spacing:-.04em}.route p{margin:0 0 12px;color:var(--muted)}
.publish{background:var(--dark);color:#fff;border-color:var(--dark)}
.publish h3{color:#fff}.publish p{color:#a3a7b2}
.publish .button{width:100%;background:#fff;color:#111;margin-top:16px}
.publish .button.off{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
.livelink{margin-top:14px;display:flex;gap:8px;align-items:center;background:#1c1f26;border-radius:12px;padding:10px 12px;font-size:12px;color:#c6c9d2;word-break:break-all}
.livelink a{color:#fff;font-weight:650}
.facts details{border-top:1px solid var(--line);padding:12px 0}
.facts details:last-child{border-bottom:1px solid var(--line)}
.facts summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;justify-content:space-between;list-style:none}
.facts summary::-webkit-details-marker{display:none}
.facts summary span{color:var(--muted);font-weight:600}
.facts ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{font-size:13px;color:var(--muted);line-height:1.45}
.facts li b{color:var(--text);font-weight:650}
.readback{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}
.readback table{width:100%;border-collapse:collapse;font-size:13px}
.readback td,.readback th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}
.readback th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.q{background:#f6f7fb;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font-size:15px;line-height:1.5}
.ok{color:#17733a}
/* your sites */
.sites{margin-top:90px;padding-top:60px;border-top:1px solid var(--line)}
.sites h2{margin:0 0 28px;font-size:clamp(34px,3.6vw,52px);letter-spacing:-.06em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.scard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:12px;transition:transform .2s ease,box-shadow .2s ease}
.scard:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,.08)}
.scard .screen{border-radius:12px}
.scard .smeta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 6px 6px}
.scard b{font-size:15px;letter-spacing:-.02em}
.pill{font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;border-radius:999px;padding:6px 10px;background:#eef0f4;color:var(--muted);white-space:nowrap}
.pill.live{background:#e3f6ea;color:#17733a}.pill.need{background:#fff1df;color:#9a5b00}.pill.fail{background:#fde8e6;color:#b42318}
.empty{color:var(--muted)}
.blank{display:grid;place-items:center;color:#5b5f6a;font-size:12px;letter-spacing:.14em;text-transform:uppercase;height:100%;position:absolute;inset:0}
.signin{max-width:440px}
@media(max-width:980px){.studio-hero{grid-template-columns:1fr;gap:24px}.review{grid-template-columns:1fr}}
@media(max-width:720px){.studio{width:min(100% - 30px,var(--max));padding-top:48px}.gallery{grid-template-columns:1fr}.bform{grid-template-columns:1fr}.panel,.writing{padding:24px}.devices{grid-template-columns:1fr}.devices .phone{width:100%;max-width:240px;margin:0 auto}.dmeta h3{font-size:26px}}
</style></head>
<body>
<div class="page-glow glow-a"></div>
<div class="page-glow glow-b"></div>
<header class="nav">
  <a href="/" class="brand brand-logo" aria-label="SiteRemade home"><img src="/siteremade-logo-black.png" alt="SiteRemade"></a>
  <nav class="nav-links"><a href="/designs">Premium designs</a></nav>
  <div class="nav-actions"><a href="/" class="button button-small button-secondary client-login">Back to SiteRemade</a></div>
</header>
<main class="studio" id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (url, body) => { const r = await fetch(url, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}); let j = {}; try { j = await r.json(); } catch (e) {} return { status: r.status, ...j }; };
const DESIGN = { beadline: { name: 'Beadline', kind: 'Car detailing studio', url: 'beadline.detail' }, halcyra: { name: 'Halcyra', kind: 'Perfume house', url: 'halcyra.parfums' }, steadyhand: { name: 'Steady Hand', kind: 'Barber shop', url: 'steadyhand.barbers' }, nube: { name: 'Nube', kind: 'Coffee shop', url: 'nube.coffee' }, ventricle: { name: 'Ventricle', kind: 'Gym', url: 'ventricle.club' }, forno: { name: 'Forno Sfacciato', kind: 'Pizzeria', url: 'forno.pizza' }, saltglass: { name: 'Saltglass', kind: 'Dental clinic', url: 'saltglass.dental' }, kova: { name: 'KOVA', kind: 'Sneaker launch', url: 'kova.run' }, clutch: { name: 'Clutch', kind: 'Toy brick set', url: 'clutch.toys' }, ondo: { name: 'ONDO', kind: 'Headphones launch', url: 'ondo.audio' }, aldane: { name: 'Aldane', kind: 'Watch launch', url: 'aldane.watch' }, lintel: { name: 'Lintel & Key', kind: 'Property listing', url: 'lintelandkey.homes' } };
let D = null, chosen = null, poll = null;
// scale a 1440px page into whatever box it sits in
function fitFrames() { document.querySelectorAll('.screen').forEach((s) => { const f = s.querySelector('iframe'); if (f) f.style.transform = `scale(${s.clientWidth / 1440})`; }); document.querySelectorAll('.pscreen').forEach((s) => { const f = s.querySelector('iframe'); if (f) f.style.transform = `scale(${s.clientWidth / 390})`; }); }
addEventListener('resize', fitFrames);
// Previews play themselves. A design's hero is driven by scrolling (Beadline washes the car as you scroll), so a preview
// nobody scrolls just sits there. Each preview (same origin) is scrolled slowly through its pinned hero on a loop, only
// while it's on screen, until someone scrolls or taps inside it.
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function autoplay(f) {
  if (f._auto) return; f._auto = true;
  const gen = f._gen = (f._gen || 0) + 1; // (a lazy preview that unloads bumps this, which ends its loop)
  let stopped = false;
  // on screen? (measured each frame from the preview's box: WebKit's IntersectionObserver says a scaled preview never is)
  const seen = () => { const r = f.parentElement.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight && r.width > 0; };
  const start = () => {
    let w, d; try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return; }
    if (!w || !d || !d.body) return;
    for (const ev of ['wheel', 'pointerdown', 'touchstart', 'keydown']) d.addEventListener(ev, () => { stopped = true; }, { passive: true, once: true });
    const hero = [...d.querySelectorAll('section')].find((s) => s.offsetHeight > w.innerHeight * 2);
    if (!hero) return;
    const RUN = 16000, HOLD = 2600, BACK = 1400, LOOP = RUN + HOLD + BACK;
    const t0 = performance.now() + 2200; // let the page settle (Halcyra fills its bottle) before the first pass
    (function tick(now) {
      if (stopped || !f.isConnected || f._gen !== gen) return;
      if (seen()) {
        const top = hero.getBoundingClientRect().top + w.scrollY, span = hero.offsetHeight - w.innerHeight;
        const t = ((now - t0) % LOOP + LOOP) % LOOP;
        const k = now < t0 ? 0 : t < RUN ? ease(t / RUN) : t < RUN + HOLD ? 1 : 0;
        w.scrollTo({ top: top + span * k, behavior: 'instant' });
      }
      requestAnimationFrame(tick);
    })(performance.now());
  };
  if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.body && f.contentDocument.body.childElementCount) start(); else f.addEventListener('load', start, { once: true });
}
const playAll = () => { document.querySelectorAll('.screen iframe, .pscreen iframe').forEach(autoplay); lazyFrames(); };
// Gallery previews are whole live designs (some run WebGL), so only the four nearest the middle of the screen run;
// one that drifts further away (past six, or well off screen) unloads. A phone never runs all of them at once.
function lazyFrames() {
  const list = [...document.querySelectorAll('iframe[data-src]')].map((f) => { const r = f.parentElement.getBoundingClientRect(); return { f, r, d: Math.abs((r.top + r.bottom) / 2 - innerHeight / 2) }; }).sort((a, b) => a.d - b.d);
  list.forEach(({ f, r }, i) => {
    const want = i < 4 && r.bottom > -innerHeight * 0.5 && r.top < innerHeight * 1.5;
    const keep = i < 6 && r.bottom > -innerHeight * 1.5 && r.top < innerHeight * 2.5;
    if (want && !f._live) { if (f._was) { f._auto = false; autoplay(f); } f.src = f.dataset.src; f._live = f._was = true; }
    else if (!keep && f._live) { f._gen = (f._gen || 0) + 1; f._auto = false; f._live = false; f.src = 'about:blank'; }
  });
}
addEventListener('scroll', lazyFrames, { passive: true });
addEventListener('resize', lazyFrames);
const frame = (src, address, live, lazy) => `<div class="frame"><div class="browser-top"><div class="browser-dots"><span></span><span></span><span></span></div><div class="browser-address">${esc(address)}</div><div></div></div><div class="screen${live ? ' live' : ''}">${src ? `<iframe ${lazy ? 'data-src' : 'src'}="${src}" title="Preview" tabindex="-1"></iframe>` : '<div class="blank">Writing…</div>'}</div></div>`;
const steps = (n) => `<ol class="steps">${['01 Design', '02 Brief', '03 Writing', '04 Review', '05 Publish'].map((t, i) => `<li class="${i === n ? 'on' : i < n ? 'done' : ''}">${t}</li>`).join('')}</ol>`;

async function load() {
  clearTimeout(poll);
  const r = await api('/api/designs');
  if (r.status === 401) return signIn();
  if (!r.ok) { $('#app').innerHTML = `<div class="studio-hero"><div><p class="eyebrow">PREMIUM DESIGNS</p><h1>Not for this account.<span>Owner only, for now.</span></h1></div></div><p class="note">${esc(r.message || '')}</p>`; return; }
  D = r; home();
}
function signIn() {
  $('#app').innerHTML = `<div class="studio-hero"><div><p class="eyebrow">PREMIUM DESIGNS</p><h1>Sign in<span>to the studio.</span></h1></div><p class="lede">Premium designs are open to the SiteRemade owner account for now.</p></div>
  <form class="panel signin bform" id="si" style="grid-template-columns:1fr"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="actions"><button class="button">Sign in</button></div><p class="err" id="siErr"></p></form>`;
  $('#si').onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); const r = await api('/api/auth/signin', { email: f.get('email'), password: f.get('password') }); if (r.ok) load(); else $('#siErr').textContent = r.message || 'Could not sign in.'; };
}
function home() {
  $('#app').innerHTML = `
  <section class="studio-hero"><div><p class="eyebrow">PREMIUM DESIGNS</p><h1>Describe the business.<span>We build the website.</span></h1></div>
    <p class="lede">Hand-built designs with real motion. Describe the business in plain words: the AI writes every line into the design, checks it, decides the design details itself and shows you everything it proposed. You review it, then publish.</p></section>
  <section class="panel create" id="create"><h2>Create a website. <span>Start with the business.</span></h2>
    <p class="sub">Describe it in a sentence or two. We pick the design that can show it truthfully, and the writer does the rest.</p>
    <div class="bform" style="grid-template-columns:1fr"><label class="wide">What is the business?<textarea id="desc" placeholder="A small watch brand launching a hand-wound three-hand watch with a 42-hour reserve"></textarea></label>
    <div class="actions"><button class="button" id="find">Find its design</button></div><p class="err" id="ferr"></p></div><div id="routeOut"></div></section>
  ${steps(0)}
  <section class="gallery">${D.designs.map((x) => { const m = DESIGN[x.design] || { name: x.design, kind: x.title, url: x.design }; return `<div class="dcard" role="button" tabindex="0" data-d="${x.design}" aria-pressed="false">${frame('/designs/demo/' + x.design, m.url, false, true)}<div class="dmeta"><div><span class="tag">${esc(m.kind)}</span><h3>${esc(m.name)}</h3></div><span class="button button-small">Use this design</span></div></div>`; }).join('')}</section>
  <div id="briefBox"></div>
  <section class="sites"><h2>Your sites</h2>${D.sites.length ? `<div class="sgrid">${D.sites.map((s) => `<div class="scard" role="button" tabindex="0" data-id="${s.id}"><div class="screen">${s.status === 'built' ? `<iframe data-src="/api/designs/sites/${s.id}/preview" tabindex="-1" title="${esc(s.business_name)}"></iframe>` : `<div class="blank">${esc(s.status === 'writing' ? 'Writing…' : s.status === 'needs_owner' ? 'Needs answers' : 'Not built')}</div>`}</div><div class="smeta"><b>${esc(s.business_name || 'Untitled')}</b>${s.published_at ? '<span class="pill live">Live</span>' : s.status === 'needs_owner' ? '<span class="pill need">Answer</span>' : s.status === 'failed' ? '<span class="pill fail">Failed</span>' : s.status === 'writing' ? '<span class="pill">Writing</span>' : '<span class="pill">Draft</span>'}</div></div>`).join('')}</div>` : '<p class="empty">Nothing yet. Pick a design above to make the first one.</p>'}</section>`;
  $('#find').onclick = async () => {
    const text = $('#desc').value.trim(); $('#ferr').textContent = '';
    const res = await api('/api/designs/route', { text }); if (!res.ok) { $('#ferr').textContent = res.message || 'Something went wrong.'; return; }
    const name = (d) => (DESIGN[d] || { name: d }).name, kind = (d) => (DESIGN[d] || { kind: '' }).kind;
    $('#routeOut').innerHTML = res.best

function pick(d, about) {

const SECTION = { watch: 'The watch', configure: 'Configurator', wind: 'Winding', dual: 'Dual time', colourways: 'Colourways', battery: 'Battery', reserve: 'Reserve form', eq: 'EQ', sets: 'The set', specs: 'Brick specs', product: 'The product', layers: 'Product details', colorways: 'Colorways', drop: 'Release', prices: 'Prices', faq: 'First-visit answers', team: 'Team', contact: 'Contact details', dough: 'Dough and oven', build: 'Build your own', party: 'Party calculator', menu: 'Price list', cut: 'Cut builder prices', drinks: 'Drinks and prices', order: 'Order ahead', visit: 'Finding you', beans: 'Beans this week', hero: 'The hero', schedule: 'Timetable', join: 'Memberships', facilities: 'Equipment', nav: 'Top bar', packages: 'Prices and packages', coatings: 'Coating comparison', correction: 'Correction figures', hours: 'Opening hours', booking: 'Booking', footer: 'Contact details', locale: 'Currency', sizes: 'Sizes and prices', specs: 'Fragrance details', notes: 'Notes and proportions', timeline: 'How long it lasts', tiers: 'How long it lasts', hud: 'How long it lasts', product: 'Fragrance details', business: 'Name', theme: 'Look', pulse: 'How to wear it', _decision: 'What the writer decided', movement: 'The watch', features: 'Sections' };

function head(s, n) { const m = DESIGN[s.design] || { name: s.design }; return `<section class="studio-hero" style="margin-bottom:32px"><div><p class="eyebrow">${esc(m.name.toUpperCase())} · PREMIUM DESIGN</p><h1>${esc(s.businessName || 'Untitled')}<span>${n === 2 ? 'is being written.' : n === 3 ? 'is ready to review.' : n === 1 ? 'needs a few answers.' : 'didn’t come out right.'}</span></h1></div><div class="actions" style="justify-content:flex-end"><button class="button button-secondary" id="back">All designs & sites</button></div></section>`; }

    const facts = s.confirm.length ? Object.entries(groups).filter(([, list]) => list.length).map(([k, list]) => `<details><summary>${esc(k)} <span>${list.length}</span></summary><ul>${list.map((c) => `<li>${c.why === 'decided by the writer' ? esc(String(c.value).slice(0, 300)) : `<b>${esc(String(c.value).slice(0, 80))}</b><br>${esc(c.why === 'the writer marked it as an assumption' ? 'Assumed by the writer' : 'Not in the brief')}${c.status === 'illustrative' ? ' · <span class="st il">Illustrative</span>' : c.status === 'proposed' && c.material ? ' · <span class="st pr">Confirm before it goes live</span>' : c.status === 'proposed' ? ' · <span class="st">Proposed</span>' : ''}`}</li>`).join('')}</ul></details>`).join('') : '<p class="ok">Every fact on the site came from the brief.</p>';
    const rb = s.readBack.map((x) => { const v = x.value; let t = '';
      if (x.format === 'week') t = `<table>${['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].map((k) => `<tr><td>${k[0].toUpperCase() + k.slice(1)}</td><td>${v && v[k] ? esc(v[k].open + '–' + v[k].close) : '<span class="note">Closed</span>'}</td></tr>`).join('')}</table>`;
      else { const rows = Array.isArray(v) ? v : [v]; t = `<table><tr>${x.fields.map((f) => `<th>${f}</th>`).join('')}</tr>${rows.map((row) => `<tr>${x.fields.map((f) => `<td>${esc(String(row && row[f] != null ? row[f] : '').replace(/\*/g, ''))}</td>`).join('')}</tr>`).join('')}</table>`; }
      return `<div class="card"><h3>${esc(x.label)}</h3>${t}</div>`; }).join('');

      <aside class="side">
        <div class="card publish"><span class="tag" style="color:#858995">${s.publicPath ? 'LIVE' : 'NOT PUBLISHED'}</span><h3>${s.publicPath ? 'It’s live.' : 'Publish when it looks right.'}</h3><p>${s.publicPath ? 'Anyone with the link can open it.' : 'It gets its own public link you can send to the business.'}</p>${s.publicPath ? `<div class="livelink"><a href="${s.publicPath}" target="_blank">${esc(url)}</a></div>` : ''}<button class="button ${s.publicPath ? 'off' : ''}" id="pub">${s.publicPath ? 'Unpublish' : 'Publish'}</button></div>
        <div class="card facts"><h3>Confirm with the business</h3>${s.reality ? `<p class="rk"><b>${s.reality.kind === 'concept' ? 'Concept business' : 'Real business'}</b>${s.reality.industry ? ' · ' + esc(s.reality.industry) : ''} · ${s.reality.counts.confirmed} from the brief, ${s.reality.counts.derived} worked out from it, ${s.reality.kind === 'concept' ? s.reality.counts.illustrative + ' illustrative' : s.reality.counts.proposed + ' proposed'}${s.reality.confirmed.length ? ` · ${s.reality.confirmed.length} confirmed by you` : ''}</p>` : ''}<p style="margin-bottom:12px">${s.confirm.length ? `${s.confirm.length} things on the site weren’t in the brief. Check them before you send the link.` : ''}</p>${facts}</div>

/* ---------- the website editor: the site's real content, by the design's own rules ---------- */
const ED_LABEL = (p) => p.split('.').map((k) => /^\d+$/.test(k) ? '#' + (+k + 1) : k.replace(/([a-z])([A-Z])/g, '$1 $2')).join(' · ');
async function showEditor(s) {
  clearTimeout(poll);
  const r = await api(`/api/designs/sites/${s.id}/editor`); if (!r.ok) return show(s);
  const ed = r.editor, pending = new Map(), ops = [];
  const groups = {};
  for (const f of ed.fields) { const top = f.path.split('.')[0]; const k = (SECTION_FOR[s.design] || {})[top] || SECTION[top] || top; (groups[k] = groups[k] || []).push(f); }
  const input = (f) => {
    const id = 'f_' + f.path.replace(/\W/g, '_'), dis = f.locked ? ' disabled' : '';
    const lim = f.kind === 'text' ? ` maxlength="${f.max}"` : f.kind === 'number' ? ` min="${f.min}" max="${f.max}" step="any"` : '';
    let ctl;
    // a week of opening hours: each day closed or open-close
    if (f.kind === 'week') ctl = `<div class="wk" data-week="${esc(f.path)}">${['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].map((dd) => { const w = f.value && f.value[dd]; return `<div data-day="${dd}"><b>${dd[0].toUpperCase() + dd.slice(1)}</b><label><input type="checkbox" data-open${w ? ' checked' : ''}> Open</label><input type="time" data-t="open" value="${w ? esc(w.open) : '09:00'}"${w ? '' : ' disabled'}><input type="time" data-t="close" value="${w ? esc(w.close) : '17:00'}"${w ? '' : ' disabled'}></div>`; }).join('')}</div>`;
    else if (f.kind === 'toggle') ctl = `<select id="${id}" data-p="${esc(f.path)}"${dis}><option value="true"${f.value ? ' selected' : ''}>On</option><option value="false"${f.value ? '' : ' selected'}>Off</option></select>`;
    else if (f.kind === 'choice') ctl = `<select id="${id}" data-p="${esc(f.path)}"${dis}>${f.optional ? `<option value=""${f.value == null ? ' selected' : ''}>The design’s own</option>` : ''}${f.options.map((o) => `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    // an optional colour: off = the design's own drawn finish; on = this colour
    else if (f.kind === 'colour' && f.optional) ctl = `<span class="oc"><label><input type="checkbox" data-oc="${esc(f.path)}"${f.value ? ' checked' : ''}${dis}> Own colour</label><input type="color" id="${id}" data-p="${esc(f.path)}" value="${esc(f.value || '#888888')}"${f.value ? '' : ' disabled'}${dis}></span>`;
    else if (f.kind === 'colour') ctl = `<input type="color" id="${id}" data-p="${esc(f.path)}" value="${esc(f.value)}"${dis}>`;
    else if (f.kind === 'text' && f.max > 70) ctl = `<textarea id="${id}" data-p="${esc(f.path)}"${lim}${dis}>${esc(f.value)}</textarea>`;
    else ctl = `<input id="${id}" data-p="${esc(f.path)}" type="${f.kind === 'number' ? 'number' : 'text'}" value="${esc(f.value)}"${lim}${dis}>`;
    const hint = f.kind === 'text' ? ` <small>${f.min}–${f.max} characters</small>` : f.kind === 'number' ? ` <small>${f.min}–${f.max}</small>` : '';
    return `<div class="ef"><span>${esc(ED_LABEL(f.path))}${f.label ? ` <small>${esc(f.label)}</small>` : ''}${f.locked ? ' · from the brief' : ''}${hint}</span>${ctl}<em class="ferr" data-e="${esc(f.path)}"></em></div>`;
  };
  const listCtl = ed.lists.map((l) => `<div class="elist"><span>${esc(ED_LABEL(l.path))}: ${l.length} (${l.min}–${l.max})</span><button type="button" class="button button-secondary" data-add="${esc(l.path)}"${l.length >= l.max ? ' disabled' : ''}>Add one</button><button type="button" class="button button-secondary" data-rm="${esc(l.path)}"${l.length <= l.min ? ' disabled' : ''}>Remove the last</button></div>`).join('');

    <div class="epreview"><div class="eptabs"><button type="button" class="button button-secondary" data-dev="desk" aria-pressed="true">Desktop</button><button type="button" class="button button-secondary" data-dev="phone" aria-pressed="false">Phone</button></div>
      <div class="epframe" id="epframe"><iframe id="epf" src="/api/designs/sites/${s.id}/preview?t=${Date.now()}" title="The website"></iframe></div></div>
    <aside class="epanel"><h3>Edit the website</h3><p class="sub">Every change is checked against the design’s rules and rebuilt into the real page.${s.reality && s.reality.kind === 'real' ? ' What you type counts as confirmed by you.' : ''}</p>
      <div class="ebar"><button class="button" id="esave" disabled>Save changes</button><button class="button button-secondary" id="eundo"${ed.revisions ? '' : ' disabled'}>Undo last save</button><button class="button button-secondary" id="edone">Done</button></div>
      <p class="err" id="eerr"></p>
      ${Object.entries(groups).map(([k, list], i) => `<details${i === 0 ? ' open' : ''}><summary>${esc(k)} <span>${list.length}</span></summary><div class="efields">${list.map(input).join('')}</div></details>`).join('')}
      ${listCtl ? `<details><summary>Lists <span>${ed.lists.length}</span></summary>${listCtl}</details>` : ''}
    </aside></section>`;
  $('#back').onclick = load;
  const save = $('#esave');
  $('#app').querySelectorAll('[data-p]').forEach((el) => el.addEventListener('input', () => { pending.set(el.dataset.p, el.value); save.disabled = false; }));
  $('#app').querySelectorAll('[data-week]').forEach((wk) => wk.addEventListener('input', () => {
    const v = {}; wk.querySelectorAll('[data-day]').forEach((row) => { const on = row.querySelector('[data-open]').checked; row.querySelectorAll('[data-t]').forEach((t) => { t.disabled = !on; }); v[row.dataset.day] = on ? { open: row.querySelector('[data-t="open"]').value, close: row.querySelector('[data-t="close"]').value } : null; });

  $('#app').querySelectorAll('[data-dev]').forEach((b) => b.addEventListener('click', () => { $('#epframe').classList.toggle('phone', b.dataset.dev === 'phone'); $('#app').querySelectorAll('[data-dev]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  save.onclick = async () => {
    save.disabled = true; $('#eerr').textContent = ''; $('#app').querySelectorAll('.ferr').forEach((e) => { e.textContent = ''; });
    const r2 = await api(`/api/designs/sites/${s.id}/edit`, { changes: [...pending].map(([path, value]) => ({ path, value })), ops });
    if (r2.ok) return showEditor(r2.site);
    $('#eerr').textContent = r2.message || 'Something went wrong.';

    save.disabled = false;
  };
  $('#eundo').onclick = async () => { const r2 = await api(`/api/designs/sites/${s.id}/undo`, {}); if (r2.ok) showEditor(r2.site); };
  $('#edone').onclick = () => show(s);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
